version: '3.8'

# Media stack - Sonarr, Radarr, qBittorrent

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    volumes:
      - /mnt/heimdall/Projects/jellyfin/config:/config
    environment:
      - PUID=${PUID:-1000}
    networks:
      - homelab
      - web
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    labels:
      traefik.enable: "true"
      traefik.http.routers.jellyfin.rule: "Host(`jellyfin.${DOMAIN:-localhost}`)"
      traefik.http.services.jellyfin.loadbalancer.server.port: 8096

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    volumes:
      - sonarr_config:/config
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    networks:
      - homelab
    labels:
      traefik.enable: "true"
      traefik.http.routers.sonarr.rule: "Host(`sonarr.${DOMAIN:-localhost}`)"
      traefik.http.services.sonarr.loadbalancer.server.port: 8989

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    volumes:
      - radarr_config:/config
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    networks:
      - homelab
    labels:
      traefik.enable: "true"
      traefik.http.routers.radarr.rule: "Host(`radarr.${DOMAIN:-localhost}`)"
      traefik.http.services.radarr.loadbalancer.server.port: 7878

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    volumes:
      - qbittorrent_config:/config
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      WEBUI_PORT: 8080
    networks:
      - homelab
    labels:
      traefik.enable: "true"
      traefik.http.routers.qbittorrent.rule: "Host(`qbittorrent.${DOMAIN:-localhost}`)"
      traefik.http.services.qbittorrent.loadbalancer.server.port: 8080

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - navidrome_data:/data
    environment:
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 48h
      ND_SCANSCHEDULE: 1h
      ND_TRANSCODINGCACHESIZE: 100MB
      ND_SCANNER_SCANONSTARTUP: "true"
      ND_LYRICS: "true"
    networks:
      - homelab
      - web

volumes:
  sonarr_config:
  radarr_config:
  qbittorrent_config:
  navidrome_data:

networks:
  homelab:
    external: true
  web:
    external: true
