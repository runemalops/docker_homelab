version: '3.8'

# Media stack - Jellyfin, Navidrome

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - /mnt/heimdall/Projects/jellyfin/config:/config
      - /mnt/heimdall/Projects/jellyfin/cache:/cache
      - /mnt/heimdall/Projects/jellyfin/media:/media:ro
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    networks:
      - homelab
      - web
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    labels:
      traefik.enable: "true"
      traefik.http.routers.jellyfin.rule: "Host(`jellyfin.${DOMAIN:-localhost}`)"
      traefik.http.services.jellyfin.loadbalancer.server.port: 8096
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "4533:4533"
    volumes:
      - navidrome_data:/data
      - /mnt/heimdall/Projects/navidrome/music:/music:ro
    environment:
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 48h
      ND_SCANSCHEDULE: 1h
      ND_TRANSCODINGCACHESIZE: 100MB
      ND_SCANNER_SCANONSTARTUP: "true"
      ND_LYRICS: "true"
    networks:
      - homelab
      - web

volumes:
  navidrome_data:

networks:
  homelab:
    external: true
  web:
    external: true
