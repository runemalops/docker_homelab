version: '3.8'

# Utility services - Homepage, Gitea, Vaultwarden, Uptime Kuma

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PUID=${PUID:-1000}
    networks:
      - homelab
      - web
    labels:
      traefik.enable: "true"
      traefik.http.routers.homepage.rule: "Host(`home.${DOMAIN:-localhost}`)"
      traefik.http.services.homepage.loadbalancer.server.port: 3000

  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: unless-stopped
    volumes:
      - gitea_data:/data
    environment:
      - USER_UID=${PUID:-1000}
    networks:
      - homelab
      - web
    labels:
      traefik.enable: "true"
      traefik.http.routers.gitea.rule: "Host(`git.${DOMAIN:-localhost}`)"
      traefik.http.services.gitea.loadbalancer.server.port: 3000

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    volumes:
      - vaultwarden_data:/data
    environment:
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN:-changeme}
    networks:
      - homelab
      - web
    labels:
      traefik.enable: "true"
      traefik.http.routers.vaultwarden.rule: "Host(`vault.${DOMAIN:-localhost}`)"
      traefik.http.services.vaultwarden.loadbalancer.server.port: 80

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - homelab
      - web
    labels:
      traefik.enable: "true"
      traefik.http.routers.uptime.rule: "Host(`uptime.${DOMAIN:-localhost}`)"
      traefik.http.services.uptime.loadbalancer.server.port: 3001

volumes:
  gitea_data:
  vaultwarden_data:
  uptime_kuma_data:

networks:
  homelab:
    external: true
  web:
    external: true
