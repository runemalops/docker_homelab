version: '3.8'

# Network services - Pi-hole, WireGuard, Nginx Proxy Manager

services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    volumes:
      - pihole_data:/etc/pihole
    environment:
      - TZ=${TZ:-UTC}
    networks:
      - homelab
      - networking
    labels:
      traefik.enable: "true"
      traefik.http.routers.pihole.rule: "Host(`pihole.${DOMAIN:-localhost}`)"
      traefik.http.services.pihole.loadbalancer.server.port: 80

  wireguard:
    image: linuxserver/wireguard:latest
    container_name: wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    volumes:
      - wireguard_config:/config
    environment:
      - PUID=${PUID:-1000}
    networks:
      - homelab
      - networking

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    volumes:
      - npm_data:/data
    networks:
      - homelab
      - networking
      - web
    labels:
      traefik.enable: "true"
      traefik.http.routers.npm.rule: "Host(`npm.${DOMAIN:-localhost}`)"
      traefik.http.services.npm.loadbalancer.server.port: 81

volumes:
  pihole_data:
  pihole_dnsmasq:
  wireguard_config:
  npm_data:
  npm_letsencrypt:

networks:
  homelab:
    external: true
  networking:
    name: networking_network
  web:
    external: true
