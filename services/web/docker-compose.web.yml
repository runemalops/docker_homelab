version: '3.8'

# Web services - Nginx, Nextcloud, WordPress

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - nginx_config:/etc/nginx/conf.d
      - nginx_html:/usr/share/nginx/html
    networks:
      - homelab
      - web
    labels:
      traefik.enable: "true"
      traefik.http.routers.nginx.rule: "Host(`nginx.${DOMAIN:-localhost}`)"
      traefik.http.services.nginx.loadbalancer.server.port: 80

  nextcloud:
    image: lscr.io/linuxserver/nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "8444:443"
    volumes:
      - nextcloud_config:/config
      - nextcloud_data:/data
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    networks:
      - homelab
      - web
      - databases
    labels:
      traefik.enable: "true"
      traefik.http.routers.nextcloud.rule: "Host(`nextcloud.${DOMAIN:-localhost}`)"
      traefik.http.services.nextcloud.loadbalancer.server.port: 443

  wordpress:
    image: wordpress:latest
    container_name: wordpress
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - wordpress_data:/var/www/html
    environment:
      - WORDPRESS_DB_HOST=mariadb
      - WORDPRESS_DB_NAME=wordpress
      - WORDPRESS_DB_USER=${POSTGRES_USER:-homelab}
      - WORDPRESS_DB_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    networks:
      - homelab
      - web
      - databases
    labels:
      traefik.enable: "true"
      traefik.http.routers.wordpress.rule: "Host(`wordpress.${DOMAIN:-localhost}`)"
      traefik.http.services.wordpress.loadbalancer.server.port: 80

volumes:
  nginx_config:
  nginx_html:
  nextcloud_config:
  nextcloud_data:
  wordpress_data:

networks:
  homelab:
    external: true
  web:
    external: true
  databases:
    external: true