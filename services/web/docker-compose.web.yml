version: '3.8'

# Web services - Nginx

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - nginx_config:/etc/nginx/conf.d
      - nginx_html:/usr/share/nginx/html
    networks:
      - homelab
      - web
    labels:
      traefik.enable: "true"
      traefik.http.routers.nginx.rule: "Host(`nginx.${DOMAIN:-localhost}`)"
      traefik.http.services.nginx.loadbalancer.server.port: 80
volumes:
  nginx_config:
  nginx_html:

networks:
  homelab:
    external: true
  web:
    external: true
  databases:
    external: true
