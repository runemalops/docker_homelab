all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  
  children:
    homelab_servers:
      hosts:
        # Add your remote servers here
        # server1:
        #   ansible_host: 192.168.1.100
        #   ansible_user: ansible
        #   ansible_ssh_private_key_file: ~/.ssh/id_rsa
        #   homelab_role: primary
      
    docker_hosts:
      hosts:
        localhost:
          docker_network: homelab_network
          docker_compose_path: /home/runemal/Documents/docker_homelab
  
  vars:
    # Common variables
    docker_compose_version: "2.20.0"
    homelab_base_path: "/home/runemal/Documents/docker_homelab"
    homelab_data_path: "/var/lib/homelab"
    homelab_config_path: "{{ homelab_base_path }}/configs"
    
    # Docker configuration
    docker_registry: "docker.io"
    docker_mirror: "https://mirror.gcr.io"
    
    # Security
    enable_firewall: true
    enable_fail2ban: true
    enable_unattended_upgrades: true