---
# Main site playbook for homelab deployment

- name: Deploy Homelab Infrastructure
  hosts: all
  become: true
  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: [always]

  roles:
    - role: docker
      tags: [docker]

    - role: docker_compose
      tags: [docker_compose]

    - role: security
      tags: [security]

    - role: homelab_services
      tags: [services]

  post_tasks:
    - name: Display deployment summary
      ansible.builtin.debug:
        msg: |
          Homelab deployment completed successfully!

          Services deployed:
          - Traefik (Reverse Proxy): http://{{ domain | default('localhost') }}:8080

          Next steps:
          1. Configure your DNS to point to this server
          2. Update the .env file with your domain and passwords
          3. Run 'docker compose up -d' to start all services
      tags: [always]
